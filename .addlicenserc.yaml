license: MIT
copyright: "Grégoire Favreau"
ignore:
  # defaults (mirrors addlicense's built-in DefaultIgnore)
  - vendor
  - node_modules
  - .git
  - dist
  - build
  - "*.pb.go"
  - "*.gen.go"
  # documentation — markdown files don't carry inline license headers
  # Note: scanner matches against d.Name() (basename), so *.md catches all depths.
  - "*.md"
  - LICENSE
  # config / dotfiles — no comment syntax
  - .gitignore
  - .npmrc
  - ".github/CODEOWNERS"
