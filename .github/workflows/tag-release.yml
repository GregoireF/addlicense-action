name: Tag Release

# Triggered by the addlicense core repo after a successful GoReleaser run.
# Payload: { "version": "v1.1.0" }
on:
  repository_dispatch:
    types: [addlicense-released]

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagging action at ${VERSION}"

      - name: Update CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          ENTRY="## ${VERSION} — ${DATE}\nSynced with [addlicense ${VERSION}](https://github.com/GregoireF/addlicense/releases/tag/${VERSION}).\n"
          # Prepend to CHANGELOG after the header line
          sed -i "s/^## \[Unreleased\]/## [Unreleased]\n\n${ENTRY}/" CHANGELOG.md || true

      - name: Commit CHANGELOG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "chore(release): sync ${{ steps.version.outputs.version }}"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "$VERSION"
          git push origin main "$VERSION"
