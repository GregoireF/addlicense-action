name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Version of the addlicense binary used in tests.
# Updated automatically by tag-release.yml on each new core release.
env:
  ADDLICENSE_VERSION: v1.0.1

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm install --save-dev @commitlint/cli @gregoiref/commitlint-config @commitlint/config-conventional
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux amd64
            runner: ubuntu-latest
          - os: macOS arm64
            runner: macos-latest
          - os: Windows amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Run action — check mode
        uses: ./
        with:
          args: --check .
          version: ${{ env.ADDLICENSE_VERSION }}
