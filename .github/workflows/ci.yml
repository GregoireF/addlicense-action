name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Version of the addlicense binary used in tests.
# Updated automatically by tag-release.yml on each new core release.
env:
  ADDLICENSE_VERSION: v1.0.1

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
      - run: npm install --save-dev @commitlint/cli @gregoiref/commitlint-config @commitlint/config-conventional
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux amd64
            runner: ubuntu-latest
          - os: macOS arm64
            runner: macos-latest
          - os: Windows amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install via action
        uses: ./
        with:
          args: ''
          version: ${{ env.ADDLICENSE_VERSION }}

      - name: --version
        shell: bash
        run: addlicense --version

      - name: --help
        shell: bash
        run: addlicense --help

      - name: Prepare test project
        shell: bash
        run: |
          mkdir -p smoke
          printf 'package main\n'   > smoke/main.go
          printf 'const x = 1;\n'  > smoke/app.ts
          printf '# config\n'      > smoke/config.yml

      - name: Add MIT headers
        shell: bash
        run: addlicense --license MIT --author "CI" smoke/

      - name: Check headers present (exit 0)
        shell: bash
        run: addlicense --check smoke/

      - name: JSON output format
        shell: bash
        run: addlicense --format json --check smoke/ | grep '"status"'

      - name: Remove headers
        shell: bash
        run: addlicense --remove smoke/

      - name: Check headers absent (exit 1)
        shell: bash
        run: addlicense --check smoke/ && exit 1 || true

      - name: Dry-run does not write
        shell: bash
        run: |
          addlicense --license MIT --author CI --dry-run smoke/
          addlicense --check smoke/ && exit 1 || true

      - name: --year-range preserves original year
        shell: bash
        run: |
          printf '// Copyright 2020 CI\n// SPDX-License-Identifier: MIT\n\npackage main\n' \
            > smoke/old.go
          addlicense --license MIT --author CI --update --year-range smoke/old.go
          grep "2020-" smoke/old.go

      - name: --dep5 generates .reuse/dep5
        shell: bash
        run: |
          printf '\x89PNG\r\n' > smoke/logo.png
          addlicense --license MIT --author CI --dep5 smoke/
          test -f smoke/.reuse/dep5
          grep "logo.png" smoke/.reuse/dep5

      - name: --reuse emits SPDX-FileCopyrightText
        shell: bash
        run: |
          printf 'package reuse\n' > smoke/reuse.go
          addlicense --license MIT --author CI --reuse smoke/reuse.go
          grep "SPDX-FileCopyrightText" smoke/reuse.go

      - name: Mutual exclusion returns exit 1
        shell: bash
        run: |
          addlicense --verbose --quiet smoke/ && exit 1 || true
          addlicense --check --remove smoke/ && exit 1 || true
